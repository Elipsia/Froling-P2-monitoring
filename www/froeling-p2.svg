<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Segoe UI, Arial, sans-serif">
  <!-- Fond -->
  <rect x="0" y="0" width="800" height="600" fill="#f4f6f8"/>

  <!-- Titre -->
  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#334">Fröling P2 — Vue d'ensemble</text>

  <!-- ======================= TEMPÉRATURE EXTÉRIEURE ======================= -->
  <g>
    <circle cx="70" cy="90" r="22" fill="#fdd835"/>
    <g stroke="#fdd835" stroke-width="3">
      <line x1="70" y1="55" x2="70" y2="45"/>
      <line x1="70" y1="125" x2="70" y2="135"/>
      <line x1="35" y1="90" x2="25" y2="90"/>
      <line x1="115" y1="90" x2="105" y2="90"/>
      <line x1="45" y1="65" x2="38" y2="58"/>
      <line x1="95" y1="115" x2="102" y2="122"/>
      <line x1="45" y1="115" x2="38" y2="122"/>
      <line x1="95" y1="65" x2="102" y2="58"/>
    </g>
    <text x="70" y="160" text-anchor="middle" font-size="13" fill="#556">Extérieur</text>
  </g>

  <!-- ======================= CHAUDIÈRE ======================= -->
  <g>
    <!-- Conduit de fumées -->
    <rect x="205" y="150" width="26" height="80" fill="#8d939b"/>
    <rect x="199" y="142" width="38" height="12" rx="3" fill="#6f757d"/>
    <text x="218" y="132" text-anchor="middle" font-size="12" fill="#556">Fumées</text>

    <!-- Corps de chaudière -->
    <rect x="80" y="230" width="170" height="210" rx="10" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2"/>
    <rect x="100" y="250" width="130" height="60" rx="6" fill="#b0bec5"/>
    <!-- Porte / chambre de combustion -->
    <rect x="105" y="330" width="120" height="80" rx="6" fill="#78909c"/>
    <circle cx="165" cy="370" r="10" fill="#ff7043"/>
    <text x="165" y="458" text-anchor="middle" font-size="14" font-weight="bold" fill="#334">Chaudière</text>
  </g>

  <!-- ======================= BALLON ECS ======================= -->
  <g>
    <path d="M 390 180
             a 55 28 0 0 1 110 0
             l 0 270
             a 55 28 0 0 1 -110 0
             z" fill="#ffe0b2" stroke="#ffb74d" stroke-width="2"/>
    <ellipse cx="445" cy="180" rx="55" ry="28" fill="#fff3e0" stroke="#ffb74d" stroke-width="2"/>
    <line x1="390" y1="290" x2="500" y2="290" stroke="#ffcc80" stroke-dasharray="4 3"/>
    <text x="445" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#334">Ballon ECS</text>
    <text x="445" y="510" text-anchor="middle" font-size="11" fill="#556">haut / bas</text>
  </g>

  <!-- ======================= SILO PELLETS ======================= -->
  <g>
    <!-- Silo -->
    <path d="M 660 90 l 110 0 l -15 280 l -80 0 z" fill="#dcedc8" stroke="#9ccc65" stroke-width="2"/>
    <!-- Niveau de pellets -->
    <path d="M 668 230 l 94 0 l -12 132 l -70 0 z" fill="#aed581"/>
    <!-- Vis d'alimentation vers la chaudière -->
    <path d="M 715 370 q -100 40 -430 -30" fill="none" stroke="#7cb342" stroke-width="4" stroke-dasharray="8 4"/>
    <text x="715" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#334">Silo pellets</text>
    <text x="715" y="215" text-anchor="middle" font-size="11" fill="#556">niveau</text>
  </g>

  <!-- ======================= LIAISONS HYDRAULIQUES ======================= -->
  <g>
    <!-- Chaudière vers ECS : départ (rouge) et retour (bleu) -->
    <line x1="250" y1="290" x2="390" y2="290" stroke="#e57373" stroke-width="5"/>
    <line x1="250" y1="380" x2="390" y2="380" stroke="#64b5f6" stroke-width="5"/>
    <circle cx="320" cy="290" r="9" fill="#fff" stroke="#e57373" stroke-width="2"/>
    <circle cx="320" cy="380" r="9" fill="#fff" stroke="#64b5f6" stroke-width="2"/>
    <text x="320" y="273" text-anchor="middle" font-size="9" fill="#556">p. ECS</text>

    <!-- ECS vers circuits -->
    <line x1="500" y1="290" x2="620" y2="290" stroke="#e57373" stroke-width="4"/>
    <line x1="500" y1="380" x2="620" y2="430" stroke="#e57373" stroke-width="4"/>
    <circle cx="560" cy="290" r="8" fill="#fff" stroke="#e57373" stroke-width="2"/>
    <circle cx="560" cy="405" r="8" fill="#fff" stroke="#e57373" stroke-width="2"/>
  </g>

  <!-- ======================= CIRCUITS DE CHAUFFAGE ======================= -->
  <g>
    <rect x="620" y="260" width="70" height="60" rx="8" fill="#ffebee" stroke="#e57373" stroke-width="2"/>
    <text x="655" y="295" text-anchor="middle" font-size="11" fill="#556">Circuit 1</text>
    <rect x="620" y="400" width="70" height="60" rx="8" fill="#ffebee" stroke="#e57373" stroke-width="2"/>
    <text x="655" y="435" text-anchor="middle" font-size="11" fill="#556">Circuit 2</text>
  </g>

  <!-- ======================= LÉGENDE ======================= -->
  <text x="80" y="560" font-size="11" fill="#556">● cercle = pompe — ligne rouge = départ chaud — ligne bleue = retour</text>
</svg>
