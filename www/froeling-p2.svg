<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Segoe UI, Arial, sans-serif">
  <!-- Fond -->
  <rect x="0" y="0" width="800" height="600" fill="#f4f6f8"/>

  <!-- Titre -->
  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#334">Fröling P2 — Vue d'ensemble</text>

  <!-- ======================= TEMPÉRATURE EXTÉRIEURE ======================= -->
  <g>
    <circle cx="70" cy="90" r="22" fill="#fdd835"/>
    <g stroke="#fdd835" stroke-width="3">
      <line x1="70" y1="55" x2="70" y2="45"/>
      <line x1="70" y1="125" x2="70" y2="135"/>
      <line x1="35" y1="90" x2="25" y2="90"/>
      <line x1="115" y1="90" x2="105" y2="90"/>
      <line x1="45" y1="65" x2="38" y2="58"/>
      <line x1="95" y1="115" x2="102" y2="122"/>
      <line x1="45" y1="115" x2="38" y2="122"/>
      <line x1="95" y1="65" x2="102" y2="58"/>
    </g>
    <text x="70" y="160" text-anchor="middle" font-size="13" fill="#556">Extérieur</text>
  </g>

  <!-- ======================= CHAUDIÈRE ======================= -->
  <g>
    <!-- Conduit de fumées -->
    <rect x="205" y="150" width="26" height="80" fill="#8d939b"/>
    <rect x="199" y="142" width="38" height="12" rx="3" fill="#6f757d"/>
    <text x="218" y="132" text-anchor="middle" font-size="12" fill="#556">Fumées</text>

    <!-- Corps de chaudière -->
    <rect x="80" y="230" width="170" height="210" rx="10" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2"/>
    <rect x="100" y="250" width="130" height="60" rx="6" fill="#b0bec5"/>
    <!-- Porte / chambre de combustion -->
    <rect x="105" y="330" width="120" height="80" rx="6" fill="#78909c"/>
    <circle cx="165" cy="370" r="10" fill="#ff7043"/>
    <text x="165" y="458" text-anchor="middle" font-size="14" font-weight="bold" fill="#334">Chaudière</text>
    <!-- Zones de valeurs (remplies par Home Assistant) -->
    <circle cx="165" cy="280" r="0" fill="none"/>
    <circle cx="165" cy="320" r="0" fill="none"/>
  </g>

  <!-- ======================= BALLON TAMPON (PUFFER) ======================= -->
  <g>
    <path d="M 350 160
             a 55 30 0 0 1 110 0
             l 0 300
             a 55 30 0 0 1 -110 0
             z" fill="#bbdefb" stroke="#64b5f6" stroke-width="2"/>
    <ellipse cx="405" cy="160" rx="55" ry="30" fill="#e3f2fd" stroke="#64b5f6" stroke-width="2"/>
    <!-- Niveaux d'eau indicatifs -->
    <line x1="350" y1="260" x2="460" y2="260" stroke="#90caf9" stroke-dasharray="4 3"/>
    <line x1="350" y1="360" x2="460" y2="360" stroke="#90caf9" stroke-dasharray="4 3"/>
    <text x="405" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#334">Ballon tampon</text>
    <text x="405" y="245" text-anchor="middle" font-size="11" fill="#556">haut</text>
    <text x="405" y="510" text-anchor="middle" font-size="11" fill="#556">bas</text>
  </g>

  <!-- ======================= BALLON ECS ======================= -->
  <g>
    <path d="M 530 240
             a 40 22 0 0 1 80 0
             l 0 190
             a 40 22 0 0 1 -80 0
             z" fill="#ffe0b2" stroke="#ffb74d" stroke-width="2"/>
    <ellipse cx="570" cy="240" rx="40" ry="22" fill="#fff3e0" stroke="#ffb74d" stroke-width="2"/>
    <text x="570" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#334">ECS</text>
  </g>

  <!-- ======================= SILO PELLETS ======================= -->
  <g>
    <!-- Silo -->
    <path d="M 660 150 l 110 0 l -15 330 l -80 0 z" fill="#dcedc8" stroke="#9ccc65" stroke-width="2"/>
    <!-- Niveau de pellets -->
    <path d="M 668 320 l 94 0 l -12 152 l -70 0 z" fill="#aed581"/>
    <!-- Vis d'alimentation -->
    <line x1="715" y1="330" x2="300" y2="330" stroke="#7cb342" stroke-width="4" stroke-dasharray="8 4"/>
    <text x="715" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#334">Silo pellets</text>
    <text x="715" y="300" text-anchor="middle" font-size="11" fill="#556">niveau</text>
  </g>

  <!-- ======================= CIRCUITS DE CHAUFFAGE ======================= -->
  <g>
    <!-- Départ chaudière vers ballon -->
    <line x1="250" y1="300" x2="350" y2="300" stroke="#e57373" stroke-width="5"/>
    <line x1="250" y1="390" x2="350" y2="390" stroke="#64b5f6" stroke-width="5"/>
    <circle cx="300" cy="300" r="9" fill="#fff" stroke="#e57373" stroke-width="2"/>
    <circle cx="300" cy="390" r="9" fill="#fff" stroke="#64b5f6" stroke-width="2"/>
    <text x="300" y="285" text-anchor="middle" font-size="9" fill="#556">p. ballon</text>

    <!-- Ballon vers circuits -->
    <line x1="460" y1="300" x2="620" y2="300" stroke="#e57373" stroke-width="4"/>
    <line x1="525" y1="430" x2="620" y2="430" stroke="#e57373" stroke-width="4"/>

    <!-- Circuit 1 et 2 -->
    <rect x="620" y="270" width="60" height="55" rx="8" fill="#ffebee" stroke="#e57373" stroke-width="2"/>
    <text x="650" y="302" text-anchor="middle" font-size="11" fill="#556">Circuit 1</text>
    <rect x="620" y="400" width="60" height="55" rx="8" fill="#ffebee" stroke="#e57373" stroke-width="2"/>
    <text x="650" y="432" text-anchor="middle" font-size="11" fill="#556">Circuit 2</text>
  </g>

  <!-- ======================= LÉGENDE POMPES ======================= -->
  <text x="80" y="560" font-size="11" fill="#556">● cercle = pompe — ligne rouge = départ chaud — ligne bleue = retour</text>
</svg>
