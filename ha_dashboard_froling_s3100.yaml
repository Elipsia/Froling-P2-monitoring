                    - sensor.froling_s3100_temperature_eau_chaude_sanitaire
                  tap_action: false
                  state_action:
                    action: call-service
                    service: floorplan.text_set
                    service_data: ${entity.state + "°C"}
      - type: entities
        title: Eau chaude sanitaire
        entities:
          - entity: sensor.froling_s3100_temperature_eau_chaude_sanitaire
            name: Température ECS

  - title: Circuit 1
    path: circuit1
    badges: []
    cards:
      - type: horizontal-stack
        cards:
          - type: custom:floorplan-card
            full_height: false
            config:
              image: /local/froeling/froeling_heizkreis01.svg
              cache: false
              stylesheet: /local/froeling/home.css
              defaults:
                hover_action: hover-info
                tap_action: more-info
              rules:
                - entities:
                    - sensor.froling_s3100_temperature_exterieure
                    - sensor.froling_s3100_temperature_depart_circuit_1
                  tap_action: false
                  state_action:
                    action: call-service
                    service: floorplan.text_set
                    service_data: ${entity.state + "°C"}
                - entities:
                    - binary_sensor.froling_s3100_demande_circuit_de_chauffage_1
                  tap_action: false
                  state_action:
                    action: call-service
                    service: floorplan.class_set
                    service_data:
                      class: '${(entity.state == "on") ? "fill-green" : "fill-grey"}'
      - type: entities
        title: Circuit de chauffage 1
        entities:
          - entity: sensor.froling_s3100_temperature_depart_circuit_1
            name: Température départ
          - entity: sensor.froling_s3100_temperature_exterieure
            name: Température extérieure

